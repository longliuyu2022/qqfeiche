name: CI

# 触发条件：main 分支的推送，以及所有针对本仓库的 Pull Request。
on:
  push:
    branches:
      - main
  pull_request:

# 同一分支上的新提交会取消仍在排队/运行的旧任务，避免浪费 Actions 时长。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: 逻辑测试与生产构建
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 静态检查
        run: npm run lint

      # 具体套数以 package.json 的 test 脚本为准，这里不写死数字免得再次过期。
      - name: 逻辑测试（纯 Node）
        run: npm test

      - name: 生产构建
        run: npm run build

      - name: 校验构建产物存在且非空
        run: |
          set -Eeuo pipefail

          if [[ ! -s dist/index.html ]]; then
            echo "构建校验失败：dist/index.html 缺失或为空" >&2
            exit 1
          fi

          JS_FILE="$(find dist/assets -maxdepth 1 -type f -name '*.js' -size +100c -print -quit)"
          if [[ -z "${JS_FILE}" ]]; then
            echo "构建校验失败：dist/assets 下没有非空的 .js 产物" >&2
            exit 1
          fi

          CSS_FILE="$(find dist/assets -maxdepth 1 -type f -name '*.css' -size +100c -print -quit)"
          if [[ -z "${CSS_FILE}" ]]; then
            echo "构建校验失败：dist/assets 下没有非空的 .css 产物" >&2
            exit 1
          fi

          echo "构建产物校验通过："
          echo "  dist/index.html"
          echo "  ${JS_FILE}"
          echo "  ${CSS_FILE}"

  browser-smoke:
    name: 账号、钱包与基础画面回归
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: artifacts/browser-smoke/
          if-no-files-found: ignore
